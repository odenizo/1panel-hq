version: '3.8'

services:
  github-actions-runner:
    image: ghcr.io/actions/runner:latest
    container_name: github-actions-runner
    restart: unless-stopped
    
    environment:
      # GitHub Configuration
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:- }
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-runner-hetzner-1}
      RUNNER_WORK_DIRECTORY: ${RUNNER_WORK_DIRECTORY:-/home/runner}
      
      # Runner Labels (comma-separated)
      RUNNER_LABELS: ${RUNNER_LABELS:-hetzner,1panel,self-hosted,linux}
      
      # Runner Ephemeral Mode (set to true for auto-cleanup after each job)
      RUNNER_EPHEMERAL: ${RUNNER_EPHEMERAL:-false}
      
      # Optional: Proxy Configuration
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    
    volumes:
      # Runner working directory
      - runner-work:/home/runner
      # Docker socket for Docker-in-Docker (optional)
      - /var/run/docker.sock:/var/run/docker.sock
    
    networks:
      - 1panel-network
    
    # Resource limits (adjust based on your Hetzner VM specs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # Health check
    healthcheck:
      test: ["CMD", "ps", "aux"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  runner-work:
    driver: local

networks:
  1panel-network:
    external: true
    name: 1panel
